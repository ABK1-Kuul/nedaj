name: PR Review Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-gate:
    name: Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -B -ntp compile

      - name: Checkstyle
        run: mvn -B -ntp checkstyle:check

      - name: Unit tests
        run: mvn -B -ntp test

      - name: SpotBugs static analysis
        run: mvn -B -ntp spotbugs:check

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always() && github.event_name == 'pull_request'
        with:
          name: JUnit Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore

      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore

  pr-feedback:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: quality-gate
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post pipeline summary
        uses: actions/github-script@v7
        env:
          JOB_RESULT: ${{ needs.quality-gate.result }}
        with:
          script: |
            const result = process.env.JOB_RESULT;
            const passed = result === 'success';
            const icon = passed ? '✅' : '❌';
            const body = [
              `## ${icon} Automated PR Review`,
              '',
              `**Pipeline status:** \`${result}\``,
              '',
              '| Check | Description |',
              '|-------|-------------|',
              '| Compile | Java 17 build |',
              '| Checkstyle | Code style & common issues |',
              '| Unit tests | JUnit 5 service/search coverage |',
              '| SpotBugs | Static bug detection |',
              '',
              passed
                ? 'All checks passed. This PR is ready for human review.'
                : 'One or more checks failed. Open the **Actions** tab for logs and downloaded reports.',
              '',
              '_Generated by [.github/workflows/pr-review.yml](.github/workflows/pr-review.yml)_'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issueNumber = context.payload.pull_request.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
            });

            const marker = '<!-- nedaj-pr-review-bot -->';
            const existing = comments.data.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            const payload = body + '\n\n' + marker;

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: payload,
              });
            }
